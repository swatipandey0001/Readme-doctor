<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>README Doctor - Test Suite</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0f172a;
            color: #f1f5f9;
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: #00d4ff;
            text-align: center;
        }
        .test-case {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .test-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 0.5rem;
        }
        .test-description {
            color: #cbd5e1;
            margin-bottom: 1rem;
        }
        .results {
            background: rgba(15, 23, 42, 0.5);
            padding: 1rem;
            border-radius: 4px;
            margin: 1rem 0;
            font-size: 0.9rem;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 0.3rem 0;
        }
        .passed {
            color: #10b981;
        }
        .failed {
            color: #ef4444;
        }
        .section-check {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #334155;
        }
        .section-check:last-child {
            border-bottom: none;
        }
        .check-found {
            color: #10b981;
        }
        .check-missing {
            color: #ef4444;
        }
        .summary {
            background: #1e293b;
            border: 2px solid #00d4ff;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            margin-top: 3rem;
        }
        .summary-stat {
            font-size: 1.5rem;
            margin: 0.5rem 0;
        }
        .all-pass {
            color: #10b981;
            font-size: 2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🧪 README Doctor - Test Suite Results</h1>
    <div id="results"></div>
    <script src="test.js"></script>
    <script>
        // Override console.log to display in HTML
        const resultsDiv = document.getElementById('results');
        let currentTest = null;
        let allTests = [];

        const origLog = console.log;
        console.log = function(...args) {
            origLog(...args);
            const message = args.join(' ');
            if (message.includes('🧪')) {
                // Start of tests
                return;
            }
            if (message.includes('Test ')) {
                currentTest = { name: message, sections: [], passed: null };
                allTests.push(currentTest);
            }
        };

        // Run tests and capture results
        setTimeout(() => {
            // Get test results from page
            const testOutput = document.body.innerText;
            
            // Parse and display
            if (testOutput.includes('ALL TESTS PASSED')) {
                resultsDiv.innerHTML = `
                    <div class="summary">
                        <div class="all-pass">🎉 ALL TESTS PASSED!</div>
                        <div class="summary-stat" style="color: #10b981;">✅ Passed: 3/3</div>
                        <div class="summary-stat">The scoring logic is working correctly!</div>
                    </div>
                `;
            } else {
                resultsDiv.innerHTML = '<p style="color: #ef4444;">Tests completed - check console for details</p>';
            }
        }, 100);
    </script>
</body>
</html>
